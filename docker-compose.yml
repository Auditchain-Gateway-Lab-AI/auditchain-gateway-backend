services:
  postgres-db:
    image: postgres:17-alpine
    container_name: auditchain-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: test_blockchain
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: auditchain-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
    ports:
      - "100.125.142.44:9000:9000" # S3 API; jangan dibuka publik di production
      - "100.125.142.44:9001:9001" # Console; hanya untuk local/staging
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - gateway-net
    healthcheck:
      # Recent MinIO images do not ship curl/wget; the bundled mc readiness
      # probe is the supported container health check.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    container_name: auditchain-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-auditchain-recovery}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
      MINIO_WRITER_USER: ${MINIO_WRITER_USER:-auditchain-writer}
      MINIO_WRITER_PASSWORD: ${MINIO_WRITER_PASSWORD:-local-writer-password-change-me}
      MINIO_READER_USER: ${MINIO_READER_USER:-auditchain-reader}
      MINIO_READER_PASSWORD: ${MINIO_READER_PASSWORD:-local-reader-password-change-me}
      MINIO_RETENTION_MODE: ${MINIO_RETENTION_MODE:-COMPLIANCE}
      MINIO_RETENTION_DAYS: ${MINIO_RETENTION_DAYS:-30}
      APP_ENV: ${APP_ENV:-local}
    volumes:
      - ./scripts/minio:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/init-bucket.sh"]
    networks:
      - gateway-net

  api-gateway:
    build: .
    container_name: auditchain-api
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_USE_TLS=${MINIO_USE_TLS:-false}
      - MINIO_BUCKET=${MINIO_BUCKET:-auditchain-recovery}
      - MINIO_ACCESS_KEY=${MINIO_WRITER_USER:-auditchain-writer}
      - MINIO_SECRET_KEY=${MINIO_WRITER_PASSWORD:-local-writer-password-change-me}
    volumes:
      - /home/besu/audit_blockchain/organizations:/home/besu/audit_blockchain/organizations:ro
    extra_hosts:
      - "peer0.org1.audit.example.com:100.125.142.44"
      - "peer0.org2.audit.example.com:100.126.175.124"
      - "peer0.org3.audit.example.com:100.103.85.7"
      - "orderer.audit.example.com:100.125.142.44"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - gateway-net
      - fabric-net

volumes:
  postgres-data:
  minio-data:

networks:
  gateway-net:
    driver: bridge
  fabric-net:
    external: true
    name: fabric_test
