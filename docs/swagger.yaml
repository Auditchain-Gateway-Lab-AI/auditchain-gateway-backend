definitions:
  audit.DashboardStatsResponse:
    properties:
      integrity_score:
        example: "99.79"
        type: string
      pending_logs:
        example: 37
        type: integer
      tampered_logs:
        example: 3
        type: integer
      total_logs:
        example: 1500
        type: integer
      total_resources:
        example: 45
        type: integer
      unreachable_logs:
        example: 10
        type: integer
      valid_logs:
        example: 1450
        type: integer
    type: object
  audit.ErrorResponse:
    properties:
      error:
        example: Pesan kesalahan atau validasi
        type: string
    type: object
  audit.RecentLogsResponse:
    properties:
      data:
        description: Array of logs
        items: {}
        type: array
      note:
        type: string
      pagination:
        properties:
          page:
            type: integer
          page_size:
            type: integer
          total_pages:
            type: integer
          total_rows:
            type: integer
        type: object
    type: object
  audit.ResourceInventoryItem:
    properties:
      latest_log_id:
        example: log-abc
        type: string
      resource:
        example: orders
        type: string
      total_logs:
        example: 500
        type: integer
    type: object
  audit.VerifyLogData:
    properties:
      actual_hash:
        type: string
      agent_discrepancies: {}
      agent_status:
        type: string
      blockchain_tx_id:
        type: string
      expected_hash:
        type: string
      is_valid:
        type: boolean
      log_id:
        type: string
      merkle_root:
        type: string
      message:
        type: string
    type: object
  audit.VerifyLogResponse:
    properties:
      data:
        $ref: '#/definitions/audit.VerifyLogData'
      layer:
        example: 4_blockchain
        type: string
      log_id:
        type: string
      message:
        type: string
      status:
        example: success
        type: string
    type: object
  auth.AuthRequest:
    properties:
      password:
        example: rahasia1234
        minLength: 6
        type: string
      username:
        example: auditor_senior
        type: string
    required:
    - password
    - username
    type: object
  auth.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  auth.ProfileResponseData:
    properties:
      client_id:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.ProfileUpdateRequest:
    properties:
      current_password:
        type: string
      full_name:
        type: string
      new_password:
        type: string
      username:
        minLength: 4
        type: string
    required:
    - username
    type: object
  auth.RegisterRequest:
    properties:
      client_id:
        example: a1b2c3d4-e5f6-7890-1234-56789abcdef0
        type: string
      password:
        example: rahasia1234
        minLength: 6
        type: string
      username:
        example: auditor_senior
        type: string
    required:
    - client_id
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponseData'
    type: object
  auth.UpdateProfileResponse:
    properties:
      message:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/auth.ProfileResponseData'
    type: object
  auth.UserResponseData:
    properties:
      client_id:
        type: string
      id:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  client.ClientDetailResponse:
    properties:
      agent_config:
        $ref: '#/definitions/models.AgentConfig'
      client:
        $ref: '#/definitions/models.Client'
      kafka_config:
        $ref: '#/definitions/models.ClientKafkaConfig'
    type: object
  client.CreateClientRequest:
    properties:
      action_field:
        example: operasi
        type: string
      actor_field:
        example: app_user
        type: string
      company_name:
        example: PT Karya Bangsa
        type: string
      create_actor_field:
        example: created_by
        type: string
      delete_actor_field:
        example: deleted_by
        type: string
      fallback_actor_field:
        example: db_user
        type: string
      resource_field:
        example: tabel
        type: string
      status:
        example: active
        type: string
      update_actor_field:
        example: updated_by
        type: string
    required:
    - company_name
    type: object
  client.CreateClientResponse:
    properties:
      api_key:
        type: string
      client_id:
        type: string
      field_mapping:
        properties:
          action_field:
            type: string
          actor_field:
            type: string
          create_actor_field:
            type: string
          delete_actor_field:
            type: string
          fallback_actor_field:
            type: string
          resource_field:
            type: string
          update_actor_field:
            type: string
        type: object
      message:
        example: Klien / Perusahaan SaaS berhasil didaftarkan
        type: string
    type: object
  client.ErrorResponse:
    properties:
      error:
        example: Pesan kesalahan atau validasi
        type: string
    type: object
  models.AgentConfig:
    properties:
      agent_url:
        description: |-
          URL Agent yang dapat dihubungi dari jaringan Gateway.
          Contoh: http://192.168.11.50:9090
        type: string
      client_id:
        type: string
      connector_status:
        description: running, skipped, failed_xxx
        type: string
      created_at:
        type: string
      db_engine:
        description: Informasi Database Klien (auto-filled dari install.sh telemetry)
        type: string
      db_name:
        description: Nama database yang diaudit
        type: string
      db_tables:
        description: Daftar tabel yang dimonitor (comma-separated)
        type: string
      hostname:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      tailscale_ip:
        description: Field auto-filled oleh install.sh telemetry callback
        type: string
      timeout_seconds:
        description: 'Timeout dalam detik untuk request ke Agent (default: 5)'
        type: integer
      updated_at:
        type: string
      user_column_name:
        type: string
      user_sync_message:
        description: detail warning/error sync user table
        type: string
      user_sync_status:
        description: ok, failed, skipped
        type: string
      user_table_name:
        description: Deteksi Tabel User via CDC (Auto-filled dari install.sh telemetry)
        type: string
    type: object
  models.Client:
    properties:
      action_field:
        type: string
      actor_field:
        description: |-
          Konfigurasi Mapping Field Dinamis
          Digunakan untuk memetakan field kustom klien ke field standar Gateway.
          Contoh untuk klien yang menggunakan auditchain-agent (payload dari audit_trail):
            ActorField           = "app_user"
            FallbackActorField   = "db_user"   ← baru: fallback jika app_user null
            ActionField          = "operasi"
            ResourceField        = "tabel"
        type: string
      api_key_prefix:
        description: Keamanan API Key
        type: string
      company_name:
        type: string
      create_actor_field:
        type: string
      created_at:
        type: string
      delete_actor_field:
        type: string
      fallback_actor_field:
        type: string
      id:
        type: string
      resource_field:
        type: string
      status:
        description: Konfigurasi SaaS
        type: string
      update_actor_field:
        type: string
      updated_at:
        type: string
    type: object
  models.ClientKafkaConfig:
    properties:
      actor_field:
        type: string
      client_id:
        type: string
      created_at:
        type: string
      db_engine:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      kafka_brokers:
        type: string
      pk_field:
        type: string
      source_system:
        type: string
      topic_prefix:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact:
    email: support@auditchain.local
    name: API Support
  description: API Enterprise untuk sistem audit log berbasis Blockchain dan Merkle
    Tree.
  termsOfService: http://swagger.io/terms/
  title: AuditChain Gateway API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentikasi pengguna dan mendapatkan token JWT untuk akses API.
      parameters:
      - description: Kredensial Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil dan mengembalikan token
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Format request tidak valid
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Username atau Password salah!
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Akun dinonaktifkan karena client tidak aktif
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal mencetak token keamanan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Mendapatkan informasi profil dari pengguna yang sedang login (berdasarkan
        JWT).
      produces:
      - application/json
      responses:
        "200":
          description: Data profil user
          schema:
            $ref: '#/definitions/auth.ProfileResponseData'
        "401":
          description: Token tidak memiliki identitas user yang valid
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Profil user tidak ditemukan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Memperbarui informasi profil pengguna yang sedang login. Bisa juga
        untuk mengubah password.
      parameters:
      - description: Data Profil Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ProfileUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profil berhasil diperbarui dan mengembalikan token baru jika
            password diubah
          schema:
            $ref: '#/definitions/auth.UpdateProfileResponse'
        "400":
          description: Validasi input gagal (misal username terlalu pendek)
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Token tidak valid atau Password saat ini tidak sesuai
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Username sudah digunakan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal memperbarui profil
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan pengguna baru (auditor/admin) ke dalam perusahaan
        (client) tertentu.
      parameters:
      - description: Data Pendaftaran
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pengguna berhasil didaftarkan
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Format tidak valid atau client_id belum diisi
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Perusahaan (Client ID) tidak terdaftar di sistem
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Username sudah digunakan
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Gagal memproses pendaftaran
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /client:
    get:
      description: Mengambil daftar semua klien/perusahaan yang terdaftar.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar klien
          schema:
            items:
              $ref: '#/definitions/models.Client'
            type: array
        "500":
          description: Gagal mengambil daftar klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all clients
      tags:
      - Client
    post:
      consumes:
      - application/json
      description: Mendaftarkan klien/perusahaan baru dan mengembalikan API Key.
      parameters:
      - description: Data Klien
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Klien berhasil didaftarkan
          schema:
            $ref: '#/definitions/client.CreateClientResponse'
        "400":
          description: Format tidak valid
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "500":
          description: Gagal mendaftarkan klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new client (SaaS tenant)
      tags:
      - Client
  /client/{id}:
    get:
      description: Mengambil detail informasi klien beserta konfigurasi agent dan
        kafka-nya.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail klien
          schema:
            $ref: '#/definitions/client.ClientDetailResponse'
        "400":
          description: ID klien kosong
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "404":
          description: Klien tidak ditemukan
          schema:
            $ref: '#/definitions/client.ErrorResponse'
        "500":
          description: Gagal mengambil data klien
          schema:
            $ref: '#/definitions/client.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get client detail
      tags:
      - Client
  /dashboard/inventory:
    get:
      description: Mengambil inventaris/daftar resource unik (tabel/entity) yang terekam.
      produces:
      - application/json
      responses:
        "200":
          description: Daftar resource inventory
          schema:
            items:
              $ref: '#/definitions/audit.ResourceInventoryItem'
            type: array
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal memuat daftar data
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get resource inventory
      tags:
      - Audit
  /dashboard/logs:
    get:
      description: Mengambil daftar log terbaru dengan dukungan paginasi dan filter.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Ukuran Halaman (default: 10)'
        in: query
        name: page_size
        type: integer
      - description: Filter Status Integritas (valid, tampered, unreachable)
        in: query
        name: integrity_status
        type: string
      - description: Urutan (asc, desc)
        in: query
        name: sort_order
        type: string
      - description: Filter Tabel Sumber
        in: query
        name: source_table
        type: string
      - description: Filter Database Engine
        in: query
        name: db_engine
        type: string
      - description: Waktu Mulai (RFC3339)
        in: query
        name: from
        type: string
      - description: Waktu Selesai (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar log beserta data paginasi
          schema:
            $ref: '#/definitions/audit.RecentLogsResponse'
        "400":
          description: Parameter tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal mengambil log terbaru
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recent audit logs
      tags:
      - Audit
  /dashboard/stats:
    get:
      description: Mengambil statistik ringkasan dashboard seperti jumlah log dan
        status integritas.
      produces:
      - application/json
      responses:
        "200":
          description: Statistik dashboard
          schema:
            $ref: '#/definitions/audit.DashboardStatsResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "500":
          description: Gagal mengambil statistik
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard statistics
      tags:
      - Audit
  /dashboard/verify/{log_id}:
    get:
      description: Memverifikasi integritas satu log tertentu (Lapis 2, 3, dan 4).
      parameters:
      - description: ID Log
        in: path
        name: log_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Verifikasi sukses dan log valid
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "202":
          description: Verifikasi pending/dalam proses
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "401":
          description: Identitas client tidak valid
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "404":
          description: Log tidak ditemukan
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
        "409":
          description: Verifikasi gagal/tampered pada suatu layer
          schema:
            $ref: '#/definitions/audit.VerifyLogResponse'
        "500":
          description: Kesalahan sistem saat verifikasi
          schema:
            $ref: '#/definitions/audit.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a specific log
      tags:
      - Audit
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
