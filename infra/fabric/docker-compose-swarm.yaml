version: "3.8"

networks:
  audit_net:
    external: true
    name: audit_net

services:

  # ============================================================
  # ORDERER - Node 1 (semeru: 192.168.11.94)
  # ============================================================
  orderer:
    image: hyperledger/fabric-orderer:2.5
    hostname: orderer.audit.example.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=AuditOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - /home/besu/audit_blockchain/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - /home/besu/audit_blockchain/organizations/ordererOrganizations/audit.example.com/orderers/orderer.audit.example.com/msp:/var/hyperledger/orderer/msp
      - /home/besu/audit_blockchain/organizations/ordererOrganizations/audit.example.com/orderers/orderer.audit.example.com/tls:/var/hyperledger/orderer/tls
      - /home/besu/audit_blockchain/backup/orderer:/var/hyperledger/production/orderer
    ports:
      - target: 7050
        published: 7050
        protocol: tcp
        mode: host
    networks:
      audit_net:
        aliases:
          - orderer.audit.example.com
    deploy:
      placement:
        constraints:
          - node.labels.lokasi == manager

  # ============================================================
  # PEER0 ORG1 - Node 1 (semeru: 192.168.11.94)
  # ============================================================
  peer0-org1:
    image: hyperledger/fabric-peer:2.5
    hostname: peer0.org1.audit.example.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=audit_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.org1.audit.example.com
      - CORE_PEER_ADDRESS=peer0.org1.audit.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.audit.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.audit.example.com:7051,peer0.org3.audit.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.audit.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/besu/audit_blockchain/organizations/peerOrganizations/org1.audit.example.com/peers/peer0.org1.audit.example.com/msp:/etc/hyperledger/fabric/msp
      - /home/besu/audit_blockchain/organizations/peerOrganizations/org1.audit.example.com/peers/peer0.org1.audit.example.com/tls:/etc/hyperledger/fabric/tls
      - /home/besu/audit_blockchain/backup/peer0:/var/hyperledger/production
    extra_hosts:
      - "orderer.audit.example.com:192.168.11.94"
      - "peer0.org2.audit.example.com:192.168.11.17"
      - "peer0.org3.audit.example.com:192.168.11.85"
    ports:
      - target: 7051
        published: 7051
        protocol: tcp
        mode: host
    networks:
      audit_net:
        aliases:
          - peer0.org1.audit.example.com
    deploy:
      placement:
        constraints:
          - node.labels.lokasi == manager

  # ============================================================
  # CLI - Node 1 (semeru: 192.168.11.94)
  # ============================================================
  cli:
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.audit.example.com/peers/peer0.org1.audit.example.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.audit.example.com/users/Admin@org1.audit.example.com/msp
      - CORE_PEER_ADDRESS=peer0.org1.audit.example.com:7051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/besu/audit_blockchain/chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - /home/besu/audit_blockchain/organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - /home/besu/audit_blockchain/channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
    extra_hosts:
      - "orderer.audit.example.com:192.168.11.94"
      - "peer0.org1.audit.example.com:192.168.11.94"
      - "peer0.org2.audit.example.com:192.168.11.17"
      - "peer0.org3.audit.example.com:192.168.11.85"
    networks:
      - audit_net
    deploy:
      placement:
        constraints:
          - node.labels.lokasi == manager

  # ============================================================
  # PEER0 ORG2 - Node 2 (node2: 192.168.11.17)
  # ============================================================
  peer0-org2:
    image: hyperledger/fabric-peer:2.5
    hostname: peer0.org2.audit.example.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=audit_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.org2.audit.example.com
      - CORE_PEER_ADDRESS=peer0.org2.audit.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.audit.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.audit.example.com:7051,peer0.org3.audit.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.audit.example.com:7051
      - CORE_PEER_LOCALMSPID=Org2MSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/node2/audit_blockchain/organizations/peerOrganizations/org2.audit.example.com/peers/peer0.org2.audit.example.com/msp:/etc/hyperledger/fabric/msp
      - /home/node2/audit_blockchain/organizations/peerOrganizations/org2.audit.example.com/peers/peer0.org2.audit.example.com/tls:/etc/hyperledger/fabric/tls
      - /home/node2/audit_blockchain/backup/peer0-org2:/var/hyperledger/production
    extra_hosts:
      - "orderer.audit.example.com:192.168.11.94"
      - "peer0.org1.audit.example.com:192.168.11.94"
      - "peer0.org3.audit.example.com:192.168.11.85"
    ports:
      - target: 7051
        published: 7051
        protocol: tcp
        mode: host
    networks:
      audit_net:
        aliases:
          - peer0.org2.audit.example.com
    deploy:
      placement:
        constraints:
          - node.labels.lokasi == worker1

  # ============================================================
  # PEER0 ORG3 - Node 3 (node3: 192.168.11.85)
  # ============================================================
  peer0-org3:
    image: hyperledger/fabric-peer:2.5
    hostname: peer0.org3.audit.example.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=audit_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_ID=peer0.org3.audit.example.com
      - CORE_PEER_ADDRESS=peer0.org3.audit.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3.audit.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.audit.example.com:7051,peer0.org2.audit.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.audit.example.com:7051
      - CORE_PEER_LOCALMSPID=Org3MSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /home/node3/audit_blockchain/organizations/peerOrganizations/org3.audit.example.com/peers/peer0.org3.audit.example.com/msp:/etc/hyperledger/fabric/msp
      - /home/node3/audit_blockchain/organizations/peerOrganizations/org3.audit.example.com/peers/peer0.org3.audit.example.com/tls:/etc/hyperledger/fabric/tls
      - /home/node3/audit_blockchain/backup/peer0-org3:/var/hyperledger/production
    extra_hosts:
      - "orderer.audit.example.com:192.168.11.94"
      - "peer0.org1.audit.example.com:192.168.11.94"
      - "peer0.org2.audit.example.com:192.168.11.17"
    ports:
      - target: 7051
        published: 7051
        protocol: tcp
        mode: host
    networks:
      audit_net:
        aliases:
          - peer0.org3.audit.example.com
    deploy:
      placement:
        constraints:
          - node.labels.lokasi == worker2
